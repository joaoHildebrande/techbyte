# VirtualHost para responder na porta 8080 e no DNS local techbyte.local
Listen 8080

<VirtualHost *:80 *:8080>
    ServerName techbyte.local
    ServerAlias www.techbyte.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Proibir listagem de diretórios
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/techbyte_error.log
    CustomLog ${APACHE_LOG_DIR}/techbyte_access.log combined
</VirtualHost>
